name: validate-findings

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the validator
        run: python3 scripts/validate_findings.py --self-test

      - name: Validate the committed demo engagement
        run: python3 scripts/validate_findings.py examples/fixtures/vulnbank-demo/engagement-vulnbank-demo
